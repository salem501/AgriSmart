<div class="layout-container">
  <app-sidebar
    [(visible)]="sidebarVisible"
    [isMobile]="isMobile">
  </app-sidebar>
  <div class="main-area" [class.sidebar-open]="sidebarVisible && !isMobile">
    <p-button
      icon="fa-solid fa-bars"
      [rounded]="true"
      severity="contrast"
      (onClick)="toggleSidebar()"/>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
