<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">
            <i class="fa-solid fa-calendar title-icon"></i>
            Événements &amp; Activités
        </h1>
        <p-button label="Ajouter Événement" icon="fa-solid fa-plus" (onClick)="ajouterEvenement()" />
    </div>

    <div class="evenements-grid">
        @for (evenement of evenements(); track evenement.id) {
        <p-card styleClass="evenement-card">
            <ng-template #header>
                <div class="card-header-content">
                    <i class="fa-solid fa-calendar-plus card-icon"></i>
                    <span class="card-title">{{ evenement.semaine }}</span>
                </div>
            </ng-template>

            <div class="field-group">
                <p-floatlabel variant="on">
                    <p-datepicker id="date-{{evenement.id}}" [(ngModel)]="evenement.date"
                        [showIcon]="true" dateFormat="yy-mm-dd" styleClass="full-width" />
                    <label for="date-{{evenement.id}}">Date</label>
                </p-floatlabel>
            </div>

            <div class="field-group">
                <p-floatlabel variant="on">
                    <input pInputText id="nom-{{evenement.id}}" [(ngModel)]="evenement.nom"
                        placeholder="Ex: Semis de printemps" class="full-width" />
                    <label for="nom-{{evenement.id}}">Nom de l'événement</label>
                </p-floatlabel>
            </div>

            <div class="field-group">
                <p-floatlabel variant="on">
                    <textarea pTextarea id="details-{{evenement.id}}" [(ngModel)]="evenement.details"
                        rows="3" class="full-width"></textarea>
                    <label for="details-{{evenement.id}}">Détails</label>
                </p-floatlabel>
            </div>
        </p-card>
        }
    </div>
</div>
