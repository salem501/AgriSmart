<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">
            <mat-icon class="title-icon">event</mat-icon>
            Événements &amp; Activités
        </h1>
        <button mat-raised-button color="primary" (click)="ajouterEvenement()">
            <mat-icon>add</mat-icon> Ajouter Événement
        </button>
    </div>

    <div class="evenements-grid">
        @for (evenement of evenements(); track evenement.id) {
        <mat-card class="evenement-card">
            <mat-card-header>
                <mat-card-title>
                    <mat-icon class="card-icon">calendar_today</mat-icon>
                    {{ evenement.semaine }}
                </mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Date</mat-label>
                    <input matInput [matDatepicker]="picker" [(ngModel)]="evenement.date">
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nom de l'événement</mat-label>
                    <input matInput [(ngModel)]="evenement.nom" placeholder="Ex: Semis de printemps">
                    <mat-icon matSuffix>agriculture</mat-icon>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Détails</mat-label>
                    <textarea matInput [(ngModel)]="evenement.details" rows="3"
                        placeholder="Décrivez l'événement..."></textarea>
                </mat-form-field>
            </mat-card-content>
        </mat-card>
        }
    </div>
</div>
