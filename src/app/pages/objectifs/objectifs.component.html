<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">
      <i class="fa-solid fa-flag title-icon"></i>
      Objectifs Mensuels &amp; KPIs
    </h1>
    <p-button label="Ajouter Objectif" icon="fa-solid fa-plus" (onClick)="ajouterObjectif()" />
  </div>

  <!-- Objectifs Cards -->
  <div class="objectifs-grid">
    @for (objectif of objectifs(); track objectif.id) {
    <p-card styleClass="objectif-card">
      <ng-template #header>
        <div class="card-header-content">
          <div class="card-title-row">
            <i class="fa-solid fa-bullseye card-icon"></i>
            <span class="card-title">Objectif {{ objectif.id }}</span>
          </div>
          <p-tag [value]="objectif.progression + '% réalisé'" [severity]="getTagSeverity(objectif.progression)" />
        </div>
      </ng-template>

      <div class="field-group">
        <p-floatlabel variant="on">
          <input pInputText id="titre-{{objectif.id}}" [(ngModel)]="objectif.titre" class="full-width" />
          <label for="titre-{{objectif.id}}">Titre de l'objectif</label>
        </p-floatlabel>
      </div>

      <div class="field-group">
        <p-floatlabel variant="on">
          <textarea pTextarea id="details-{{objectif.id}}" [(ngModel)]="objectif.details" rows="3"
            class="full-width"></textarea>
          <label for="details-{{objectif.id}}">Détails</label>
        </p-floatlabel>
      </div>

      <div class="progress-section">
        <div class="progress-header">
          <span class="progress-label">Progression</span>
          <span class="progress-value">{{ objectif.progression }}%</span>
        </div>
        <p-progressbar [value]="objectif.progression" [showValue]="false" styleClass="custom-progressbar" />
      </div>
    </p-card>
    }
  </div>

  <p-divider />

  <!-- KPIs Section -->
  <div class="kpis-section">
    <div class="section-header">
      <h2 class="section-title">
        <i class="fa-solid fa-chart-bar title-icon"></i>
        Indicateurs de Performance (KPIs)
      </h2>
      <p-button label="Ajouter KPI" icon="fa-solid fa-plus" severity="secondary" (onClick)="ajouterKPI()" />
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="kpi-table">
          <thead>
            <tr>
              <th>Indicateur</th>
              <th>Objectif Mensuel</th>
              <th>Réalisé</th>
              <th>% Réalisation</th>
            </tr>
          </thead>
          <tbody>
            @for (kpi of kpis(); track kpi.id) {
            <tr>
              <td>
                <input pInputText [(ngModel)]="kpi.indicateur" placeholder="Indicateur" class="table-input" />
              </td>
              <td>
                <input pInputText [(ngModel)]="kpi.objectifMensuel" (input)="calculerPourcentage(kpi)"
                  placeholder="Objectif" class="table-input" />
              </td>
              <td>
                <input pInputText [(ngModel)]="kpi.realise" (input)="calculerPourcentage(kpi)"
                  placeholder="Réalisé" class="table-input" />
              </td>
              <td>
                <p-tag [value]="kpi.pourcentage || '—'" [severity]="kpi.pourcentage ? 'info' : 'secondary'" />
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
