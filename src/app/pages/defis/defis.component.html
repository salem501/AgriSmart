<div class="page-container">
  @if (showAddDefiPage) {
  <div class="page-header">
    <h1 class="page-title">
      <i class="fa-solid fa-circle-plus title-icon"></i>
      Ajouter un nouveau Défi ou Obstacle
    </h1>
  </div>
  <div class="defi-form">
    <div class="field-group">
      <p-floatlabel variant="on">
        <input pInputText id="defi-titre" class="full-width" />
        <label for="defi-titre">Titre</label>
      </p-floatlabel>
    </div>
    <div class="field-group">
      <p-floatlabel variant="on">
        <p-datepicker id="defi-date" [showIcon]="true" dateFormat="yy-mm-dd" styleClass="full-width" />
        <label for="defi-date">Choisir une date</label>
      </p-floatlabel>
    </div>
    <div class="field-group">
      <p-floatlabel variant="on">
        <textarea pTextarea id="defi-desc" rows="6" class="full-width"></textarea>
        <label for="defi-desc">Description</label>
      </p-floatlabel>
    </div>
    <div class="field-group">
      <p-floatlabel variant="on">
        <textarea pTextarea id="defi-solution" rows="6" class="full-width"></textarea>
        <label for="defi-solution">Solution Appliquée</label>
      </p-floatlabel>
    </div>
    <div class="field-group">
      <p-floatlabel variant="on">
        <textarea pTextarea id="defi-resultat" rows="6" class="full-width"></textarea>
        <label for="defi-resultat">Résultat</label>
      </p-floatlabel>
    </div>
  </div>
  <div class="form-actions">
    <p-button label="Retour" icon="fa-solid fa-arrow-left" severity="secondary" [outlined]="true" (onClick)="showDefiList()" />
    <p-button label="Ajouter" icon="fa-solid fa-check" (onClick)="showDefiList()" />
  </div>
  } @else {
  <div class="page-header">
    <h1 class="page-title">
      <i class="fa-solid fa-triangle-exclamation title-icon"></i>
      Défis &amp; Obstacles
    </h1>
    <p-button label="Ajouter Défi" icon="fa-solid fa-plus" (onClick)="showAddDefiForm()" />
  </div>
  <p-accordion [multiple]="true">
    @for (defi of defis; track defi.id) {
    <p-accordionpanel>
      <p-accordionheader>
        <div class="accordion-header-content">
          <span class="accordion-title">{{ defi.titre }}</span>
          <span class="accordion-date">{{ defi.date }}</span>
        </div>
      </p-accordionheader>
      <p-accordioncontent>
        <div class="accordion-body">
          <p><strong>Description:</strong> {{ defi.description }}</p>
          <p><strong>Solution:</strong> {{ defi.solutionAppliquee }}</p>
        </div>
      </p-accordioncontent>
    </p-accordionpanel>
    }
  </p-accordion>
  }
</div>
