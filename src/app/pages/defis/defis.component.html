<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">
      Défis &amp; Obstacles
    </h1>
    <button>Ajouter Défi</button>
  </div>
  <mat-accordion>
    @for (defi of defis; track defi.id) {
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title> {{ defi.titre }}</mat-panel-title>
          <mat-panel-description> {{ defi.date }}</mat-panel-description>
        </mat-expansion-panel-header>
        <p>{{ defi.description }}</p>
        <p>{{ defi.solutionAppliquee }}</p>
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
